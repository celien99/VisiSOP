[project]
name = "sop_dsl"
version = "0.1.0"
requires-python = ">=3.14,<4.0"
dependencies = ["contracts", "pydantic>=2.13.5,<3.0.0"]

[tool.uv.sources]
contracts = { workspace = true }

[dependency-groups]
dev = [
    "pytest<10.0.0,>=7.4.3",
    "mypy<3.0.0,>=1.8.0",
    "ty>=0.0.25",
    "ruff<1.0.0,>=0.16.0",
    "pyyaml>=6.0",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true

[tool.ruff]
target-version = "py314"

[tool.ty.terminal]
error-on-warning = true

[tool.hatch.build.targets.wheel]
packages = ["sop_dsl"]
