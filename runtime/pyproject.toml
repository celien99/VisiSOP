[project]
name = "video-runtime"
version = "0.1.0"
description = "VisiSOP native video runtime"
requires-python = ">=3.12,<3.13"
dependencies = [
    "contracts",
    "numpy>=2.0.0",
    "opencv-python-headless>=4.10.0",
    "onnxruntime>=1.19.0",
    "httpx>=0.28.0",
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",
    "pydantic-settings>=2.10.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
gige = ["harvesters>=1.4.0"]

[dependency-groups]
dev = [
    "pytest<10.0.0,>=7.4.3",
    "mypy<3.0.0,>=1.8.0",
    "ruff<1.0.0,>=0.16.0",
]

[tool.uv.sources]
contracts = { path = "../contracts" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["video_runtime"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
    "T201",   # print statements are not allowed
]
ignore = [
    "E501",  # line too long
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # raise ... from e is optional (HTTPException idiom)
]

[tool.ruff.lint.per-file-ignores]
"video_runtime/tools/*" = ["T201"]

[tool.pytest.ini_options]
testpaths = ["tests"]
