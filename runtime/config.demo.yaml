runtime_id: runtime-01
station_id: st-01
camera:
  camera_id: cam-01
  role: overview
  # kind: mvs uses HIKROBOT's SDK; kind: gige uses harvesters with a GenTL
  # producer, whose metadata this producer encodes in a non-UTF-8 codepage.
  source:
    kind: mvs
    serial: DA9184675
    ip: null
    # Only exposure and gain are written; resolution, pixel format, trigger,
    # and packet size stay as configured on the camera in MVS.
    exposure_us: 20000
    gain_db: 6.0
inference_interval_ms: 100
model:
  onnx_path: models/yolo11n.onnx
  class_names_path: models/coco.names
  input_size: 640
  confidence: 0.25
  iou: 0.45
backend:
  base_url: http://127.0.0.1:8000/api
  timeout_ms: 2000
  retries: 3
preview:
  host: 127.0.0.1
  port: 8001
  fps: 10
zones:
  - name: pickup
    rect: [0.68, 0.10, 0.99, 0.95]
    classes: [bottle]
    event_type: bottle_in_pickup_zone
    min_confidence: 0.25
    emit_interval_ms: 500
  - name: target
    rect: [0.08, 0.35, 0.55, 0.95]
    classes: [bottle]
    event_type: bottle_in_target_zone
    min_confidence: 0.25
    emit_interval_ms: 500
